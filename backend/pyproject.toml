[project]
name = "ifrs18-backend"
version = "0.1.0"
description = "IFRS 18 Impact Analyzer — API and classification engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",  # sync driver, used by Alembic only
    "alembic>=1.14",
    "structlog>=24.4",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "ANN",       # missing type annotations (spec §29: Python type hints)
    "S",         # bandit (spec §31)
    "RUF",
]
ignore = [
    "ANN401",    # allow typing.Any where genuinely needed
    "S101",      # assert is fine in tests; guarded per-file below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001"]
"alembic/**" = ["ANN", "E501", "N999"]

# Architecture §5 (no binary floats in the accounting core) is enforced by an AST
# check in tests/test_no_float_in_domain.py, not by ruff: ruff's banned-api only
# covers imports and cannot see a bare `float` annotation.

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance",
]
# SQLAlchemy warns about transaction misuse that would otherwise pass silently
# and make integration tests unreliable. Treat those as failures.
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::DeprecationWarning",
]
