name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ifrs18
          POSTGRES_PASSWORD: ifrs18
          POSTGRES_DB: ifrs18
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ifrs18 -d ifrs18"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      IFRS18_ENVIRONMENT: ci
      IFRS18_DATABASE_URL: postgresql+asyncpg://ifrs18:ifrs18@localhost:5432/ifrs18

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python ${{ env.PYTHON_VERSION }} .venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy app tests

      # Before the tests, not after. Run the other way round — as this
      # workflow did for its first twenty runs — every database-backed test
      # meets an empty schema and the whole job fails on `relation "users"
      # does not exist`. It passed locally the entire time, because a
      # developer's database was migrated once and stayed migrated.
      - name: Migrations apply cleanly
        run: .venv/bin/alembic upgrade head

      - name: Schema matches models (no un-migrated drift)
        run: .venv/bin/alembic check

      # Three tests read the account catalog out of the database rather than
      # the JSON, so a migrated-but-empty schema is not enough.
      - name: Seed the catalog and rule set
        run: .venv/bin/python -m app.cli seed

      - name: Tests
        run: .venv/bin/pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-install:
    name: Backend (production install)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The other backend job installs `.[dev]`, which quietly supplies packages
    # the application imports but never declares — email-validator reached the
    # app that way, and the production image could not import `app.main` at
    # all. This job installs exactly what a deployment installs, from a built
    # wheel rather than the source tree, and imports the thing.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install it alone, with no dev extra
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .prod
          uv pip install --python .prod/bin/python dist/*.whl

      - name: The application imports, and its data files shipped
        # From /tmp, so nothing resolves out of the source tree by accident.
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/backend/.prod/bin/python" - <<'PY'
          from app.main import app
          from app.data.catalog import load_catalog
          from app.data.rule_catalog import get_engine
          from app.data.question_catalog import get_questions

          assert app.routes, "no routes registered"
          assert load_catalog()[1], "the account catalog did not ship"
          assert get_engine().rules, "the rule set did not ship"
          assert get_questions(), "the review questions did not ship"
          print("production install boots")
          PY

      - name: The validation harness runs without the AI SDK installed
        # Spec §1: the product is defined to work without the assistant, so the
        # absence of the SDK must be an ordinary configuration, not a crash.
        run: |
          cd /tmp
          printf '\xef\xbb\xbf과목,금액\n매출액,1000\n매출원가,-600\n매출총이익,400\n' > s.csv
          "$GITHUB_WORKSPACE/backend/.prod/bin/python" -m app.cli validate s.csv --ai

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ifrs18
          POSTGRES_PASSWORD: ifrs18
          POSTGRES_DB: ifrs18
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ifrs18 -d ifrs18"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      IFRS18_ENVIRONMENT: ci
      IFRS18_DATABASE_URL: postgresql+asyncpg://ifrs18:ifrs18@localhost:5432/ifrs18
      IFRS18_CORS_ORIGINS: http://127.0.0.1:3000
      # Fixed, so a token minted before the server is polled stays valid after.
      IFRS18_AUTH_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the backend
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Migrate
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Seed
        working-directory: backend
        run: .venv/bin/python -m app.cli seed

      - name: Start the API
        working-directory: backend
        run: |
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          disown
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "the API never became healthy:" && cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # `output: standalone` — `next start` serves a different bundle from
          # the one that was built, so the server the tests hit would not be
          # the artefact under test.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          disown
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          echo "the web app never became healthy:" && cat "$RUNNER_TEMP/web.log"
          exit 1

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Server logs
        if: failure()
        run: |
          echo "--- api ---" && cat "$RUNNER_TEMP/api.log" || true
          echo "--- web ---" && cat "$RUNNER_TEMP/web.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
