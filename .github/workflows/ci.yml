name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ifrs18
          POSTGRES_PASSWORD: ifrs18
          POSTGRES_DB: ifrs18
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ifrs18 -d ifrs18"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      IFRS18_ENVIRONMENT: ci
      IFRS18_DATABASE_URL: postgresql+asyncpg://ifrs18:ifrs18@localhost:5432/ifrs18

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python ${{ env.PYTHON_VERSION }} .venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy app tests

      - name: Tests
        run: .venv/bin/pytest --cov=app --cov-report=term-missing

      - name: Migrations apply cleanly
        run: .venv/bin/alembic upgrade head

      - name: Schema matches models (no un-migrated drift)
        run: |
          .venv/bin/alembic check

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
